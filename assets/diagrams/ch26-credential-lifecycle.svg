<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="900" height="210" fill="#ffffff"/>
  <defs>
    <marker id="ar26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52525b"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="12.5" fill="#52525b">K8s RBAC、ESO 注入的外部凭据、Workload Identity 临时凭据 —— 三类共用同一条生命周期</text>

  <rect x="16" y="44" width="112" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="72" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">申请</text>
  <text x="72" y="86" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Git PR</text>
  <text x="72" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">（人的权限）</text>

  <rect x="142" y="44" width="112" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="198" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">评审</text>
  <text x="198" y="86" text-anchor="middle" font-size="10.5" fill="#1e3a8a">双人 review</text>
  <text x="198" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">conftest 拒通配</text>

  <rect x="268" y="44" width="112" height="74" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="324" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">发放</text>
  <text x="324" y="86" text-anchor="middle" font-size="10.5" fill="#14532d">CI 门禁 +</text>
  <text x="324" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">GitOps 同步</text>

  <rect x="394" y="44" width="112" height="74" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="450" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">使用</text>
  <text x="450" y="86" text-anchor="middle" font-size="10.5" fill="#14532d">每次请求</text>
  <text x="450" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">逐条鉴权判定</text>

  <rect x="520" y="44" width="112" height="74" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="576" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">轮换</text>
  <text x="576" y="86" text-anchor="middle" font-size="10.5" fill="#92400e">定期 / 事件</text>
  <text x="576" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">自动刷新</text>

  <rect x="646" y="44" width="112" height="74" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="702" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">吊销</text>
  <text x="702" y="86" text-anchor="middle" font-size="10.5" fill="#991b1b">到期 / 事件</text>
  <text x="702" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">收回权限</text>

  <rect x="772" y="44" width="112" height="74" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="828" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">复盘</text>
  <text x="828" y="86" text-anchor="middle" font-size="10.5" fill="#5b21b6">postmortem</text>
  <text x="828" y="104" text-anchor="middle" font-size="10.5" fill="#64748b">更新基线</text>

  <line x1="128" y1="81" x2="138" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>
  <line x1="254" y1="81" x2="264" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>
  <line x1="380" y1="81" x2="390" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>
  <line x1="506" y1="81" x2="516" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>
  <line x1="632" y1="81" x2="642" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>
  <line x1="758" y1="81" x2="768" y2="81" stroke="#52525b" stroke-width="1.3" marker-end="url(#ar26)"/>

  <!-- 回环：复盘 → 基线 -->
  <path d="M828,118 V136 H72 V122" fill="none" stroke="#a1a1aa" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar26)"/>
  <text x="450" y="132" text-anchor="middle" font-size="10.5" fill="#71717a">复盘回写基线：下一次申请从更严的默认值开始</text>

  <rect x="16" y="150" width="868" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="170" font-size="11.5" fill="#3f3f46">机器凭据不走「申请」：ESO 与 Workload Identity 按基线自动发放，人的权限才需要 PR 与双人评审。</text>
  <text x="36" y="187" font-size="11.5" fill="#71717a">这条链上每一个动作都必须能回答「谁、在哪留痕、何时到期」—— 答不出的授权，就是没有授权的授权。</text>
</svg>
