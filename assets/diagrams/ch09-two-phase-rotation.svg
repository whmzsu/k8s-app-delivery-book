<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- 三阶段列头 -->
  <rect x="175" y="24" width="225" height="32" rx="5" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="287" y="46" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3730a3">① 共存（不切流）</text>

  <rect x="412" y="24" width="225" height="32" rx="5" fill="#fef3c7" stroke="#fde68a"/>
  <text x="524" y="46" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#92400e">② 切流</text>

  <rect x="649" y="24" width="226" height="32" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="762" y="46" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#065f46">③ 作废旧凭据</text>

  <!-- 阶段动作 -->
  <rect x="175" y="66" width="225" height="140" rx="5" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="188" y="90" font-size="12.5" fill="#3f3f46">· Vault 增 password_new</text>
  <text x="188" y="114" font-size="12.5" fill="#3f3f46">· 保留 password</text>
  <text x="188" y="138" font-size="12.5" fill="#3f3f46">· ESO 同步两个键</text>
  <text x="188" y="162" font-size="12.5" fill="#3f3f46">· api 仍读旧键</text>
  <text x="188" y="190" font-size="12" fill="#71717a">业务无感知</text>

  <rect x="412" y="66" width="225" height="140" rx="5" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="425" y="90" font-size="12.5" fill="#3f3f46">· rollout restart api</text>
  <text x="425" y="114" font-size="12.5" fill="#3f3f46">· 新 Pod 读新键建连</text>
  <text x="425" y="138" font-size="12.5" fill="#3f3f46">· DB 同时接受两凭据</text>
  <text x="425" y="162" font-size="12.5" fill="#3f3f46">· 旧连接逐步关闭</text>
  <text x="425" y="190" font-size="12" fill="#71717a">新旧连接并存</text>

  <rect x="649" y="66" width="226" height="140" rx="5" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="662" y="90" font-size="12.5" fill="#3f3f46">· 删除 password</text>
  <text x="662" y="114" font-size="12.5" fill="#3f3f46">· new 提升为 password</text>
  <text x="662" y="138" font-size="12.5" fill="#3f3f46">· ExternalSecret 映射更新</text>
  <text x="662" y="162" font-size="12.5" fill="#3f3f46">· 再 restart 一次</text>
  <text x="662" y="190" font-size="12" fill="#71717a">旧凭据彻底失效</text>

  <!-- 阶段间箭头 -->

  <!-- 双轨时间条 -->
  <text x="20" y="262" font-size="12.5" fill="#71717a">凭据生命周期</text>

  <text x="20" y="296" font-size="12.5" fill="#3f3f46">password（旧）</text>
  <rect x="175" y="280" width="237" height="26" fill="#dcfce7" stroke="#86efac"/>
  <text x="293" y="298" text-anchor="middle" font-size="12" fill="#166534">有效</text>
  <rect x="412" y="280" width="237" height="26" fill="#dcfce7" stroke="#86efac"/>
  <text x="530" y="298" text-anchor="middle" font-size="12" fill="#166534">有效</text>
  <rect x="649" y="280" width="226" height="26" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="762" y="298" text-anchor="middle" font-size="12" fill="#b91c1c">已删除</text>

  <text x="20" y="342" font-size="12.5" fill="#3f3f46">password_new</text>
  <rect x="175" y="326" width="237" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="293" y="344" text-anchor="middle" font-size="12" fill="#71717a">已写入，未使用</text>
  <rect x="412" y="326" width="237" height="26" fill="#dcfce7" stroke="#86efac"/>
  <text x="530" y="344" text-anchor="middle" font-size="12" fill="#166534">开始使用</text>
  <rect x="649" y="326" width="226" height="26" fill="#dcfce7" stroke="#86efac"/>
  <text x="762" y="344" text-anchor="middle" font-size="12" fill="#166534">唯一有效</text>

  <!-- 共存窗口标注 -->
  <line x1="175" y1="368" x2="649" y2="368" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="175" y1="360" x2="175" y2="376" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="649" y1="360" x2="649" y2="376" stroke="#a1a1aa" stroke-width="1"/>
  <text x="412" y="388" text-anchor="middle" font-size="12.5" fill="#52525b">共存窗口：两个凭据同时有效，任何时刻都能退回</text>

  <!-- 底注 -->
  <rect x="20" y="414" width="860" height="58" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="36" y="437" font-size="12.5" fill="#92400e">轮换的安全性来自「共存窗口」而不是「操作够快」：窗口内新旧都能建连，</text>
  <text x="36" y="459" font-size="12.5" fill="#92400e">出问题只需重新 rollout restart，不必回滚密码；窗口一关，退路就没有了。</text>
</svg>
