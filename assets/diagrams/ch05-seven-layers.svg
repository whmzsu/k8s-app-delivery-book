<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="12.5" fill="#71717a">层</text>
  <text x="88" y="24" font-size="12.5" fill="#71717a">问题域（每层只解决一件事）</text>
  <text x="322" y="24" font-size="12.5" fill="#71717a">代表工具（主版本）</text>
  <text x="762" y="24" font-size="12.5" fill="#71717a">正文</text>

  <!-- L1 -->
  <rect x="20" y="34" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="59" r="13" fill="#e0e7ff"/>
  <text x="46" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">1</text>
  <text x="88" y="64" font-size="14" font-weight="bold" fill="#18181b">源码与 CI</text>
  <text x="322" y="64" font-size="12.5" fill="#3f3f46">GitHub Actions ／ GitLab CI ／ Tekton ／ Dagger</text>
  <text x="762" y="64" font-size="12.5" fill="#71717a">12</text>

  <!-- L2 -->
  <rect x="20" y="92" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="117" r="13" fill="#e0e7ff"/>
  <text x="46" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">2</text>
  <text x="88" y="122" font-size="14" font-weight="bold" fill="#18181b">构建与制品</text>
  <text x="322" y="122" font-size="12.5" fill="#3f3f46">BuildKit ／ Kaniko ／ Harbor ／ cosign</text>
  <text x="762" y="122" font-size="12.5" fill="#71717a">6、24</text>

  <!-- L3 -->
  <rect x="20" y="150" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="175" r="13" fill="#e0e7ff"/>
  <text x="46" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">3</text>
  <text x="88" y="180" font-size="14" font-weight="bold" fill="#18181b">配置与打包</text>
  <text x="322" y="180" font-size="12.5" fill="#3f3f46">Kustomize 5.x ／ Helm 4.x ／ kubeconform ／ conftest</text>
  <text x="762" y="180" font-size="12.5" fill="#71717a">10–11</text>

  <!-- L4 -->
  <rect x="20" y="208" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="233" r="13" fill="#e0e7ff"/>
  <text x="46" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">4</text>
  <text x="88" y="238" font-size="14" font-weight="bold" fill="#18181b">交付与 GitOps</text>
  <text x="322" y="238" font-size="12.5" fill="#3f3f46">Argo CD 3.x ／ Flux 2.x ／ Argo Rollouts 1.x</text>
  <text x="762" y="238" font-size="12.5" fill="#71717a">14–15</text>

  <!-- L5 -->
  <rect x="20" y="266" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="291" r="13" fill="#e0e7ff"/>
  <text x="46" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">5</text>
  <text x="88" y="296" font-size="14" font-weight="bold" fill="#18181b">扩展与运行时</text>
  <text x="322" y="296" font-size="12.5" fill="#3f3f46">Gateway API 1.x ／ ESO 2.x ／ KEDA 2.x ／ CRD·Operator</text>
  <text x="762" y="296" font-size="12.5" fill="#71717a">18–19、27–29</text>

  <!-- L6 -->
  <rect x="20" y="324" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="349" r="13" fill="#e0e7ff"/>
  <text x="46" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">6</text>
  <text x="88" y="354" font-size="14" font-weight="bold" fill="#18181b">观测与韧性</text>
  <text x="322" y="354" font-size="12.5" fill="#3f3f46">OTel Collector ／ Prometheus 3.x ／ Loki 3.x ／ Chaos Mesh</text>
  <text x="762" y="354" font-size="12.5" fill="#71717a">21–23</text>

  <!-- L7 -->
  <rect x="20" y="382" width="860" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="46" cy="407" r="13" fill="#e0e7ff"/>
  <text x="46" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">7</text>
  <text x="88" y="412" font-size="14" font-weight="bold" fill="#18181b">策略与平台</text>
  <text x="322" y="412" font-size="12.5" fill="#3f3f46">Kyverno 1.x ／ Crossplane ／ Cluster API 1.x ／ Backstage</text>
  <text x="762" y="412" font-size="12.5" fill="#71717a">25–26、30</text>

  <!-- 右侧方向箭头 -->
  <line x1="893" y1="40" x2="893" y2="426" stroke="#e4e4e7" stroke-width="1"/>

  <!-- 底注 -->
  <rect x="20" y="444" width="860" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="450" y="470" text-anchor="middle" font-size="13" fill="#1e40af">每层选至多一个工具；多数团队第一次认真填会留空三四层 —— 留空是一条结论，不是欠账</text>
</svg>
