<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1680" viewBox="0 0 1240 1680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="1240" height="1680" fill="#ffffff"/>

  <!-- ============ 页眉 ============ -->
  <rect x="0" y="0" width="1240" height="92" fill="#1e293b"/>
  <text x="40" y="49" font-size="27" font-weight="bold" fill="#ffffff">发布与回滚速查卡</text>
  <text x="40" y="76" font-size="13" fill="#cbd5e1">第 13 章 · §13.2 / §13.5 · 三策略 × 容量账 × 回滚 T0–T5</text>
  <rect x="1080" y="26" width="120" height="40" rx="20" fill="#334155" stroke="#475569"/>
  <text x="1140" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">v1.4.4</text>
  <rect x="0" y="92" width="1240" height="20" fill="#f1f5f9"/>
  <text x="40" y="106" font-size="10.5" fill="#64748b">回滚方案先于发布方案；命令可直接复制，&lt;上一版&gt; / &lt;n&gt; 用实际 sha7 / 修订号替换。命名空间 order-demo-prod。</text>

  <!-- ============ 发布前四问 ============ -->
  <rect x="20" y="124" width="1200" height="116" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="40" y="149" font-size="13" font-weight="bold" fill="#0369a1">发布前四问：任一答不出，不许发布</text>
  <g font-size="10.5">
    <rect x="40" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="52" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">① 改了 schema 吗</text>
    <text x="52" y="197" fill="#475569">是 → 先做第 16 章 expand–contract</text>
    <text x="52" y="216" fill="#475569">否则任何策略的回滚都是假回滚</text>

    <rect x="334" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="346" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">② 容量账算了吗</text>
    <text x="346" y="197" fill="#475569">峰值 Pod 数 ≤ 节点可放下的数量</text>
    <text x="346" y="216" fill="#475569">余量不足时 undo 会卡在同一个 Pending</text>

    <rect x="628" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="640" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">③ 回滚方案成文了吗</text>
    <text x="640" y="197" fill="#475569">docs/rollback-plan.md 六要素齐全</text>
    <text x="640" y="216" fill="#475569">且附本次演练记录，否则禁止发布</text>

    <rect x="922" y="158" width="278" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="934" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">④ 触发条件可判定吗</text>
    <text x="934" y="197" fill="#475569">写指标阈值，不写「感觉不对」</text>
    <text x="934" y="216" fill="#475569">例：5xx 连续 3 分钟 &gt; 1%</text>
  </g>

  <!-- ============ 行 1：滚动更新 ============ -->
  <g>
    <rect x="20" y="252" width="1200" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="252" width="6" height="190" rx="3" fill="#22c55e"/>
    <text x="40" y="280" font-size="17" font-weight="bold" fill="#0f172a">滚动更新 RollingUpdate</text>
    <text x="40" y="299" font-size="10" fill="#71717a">默认策略 · 新旧版本须共存</text>
    <rect x="290" y="258" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="287" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="287" font-size="12" fill="#78350f">需秒级整体回退 / 新旧不能共存 / 节点余量不足 → 不该用</text>
    <rect x="36" y="310" width="1168" height="62" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="330" font-weight="bold" fill="#64748b">容量成本</text>
      <text x="48" y="350" fill="#334155">低：峰值 replicas + maxSurge</text>
      <text x="330" y="330" font-weight="bold" fill="#64748b">回退速度</text>
      <text x="330" y="350" fill="#334155">慢：再滚一次，2–6 分钟</text>
      <text x="620" y="330" font-weight="bold" fill="#64748b">流量粒度</text>
      <text x="620" y="350" fill="#334155">无，按比例自然替换</text>
      <text x="880" y="330" font-weight="bold" fill="#64748b">适用前提</text>
      <text x="880" y="350" fill="#334155">schema 兼容 + 有节点余量</text>
    </g>
    <rect x="36" y="378" width="1168" height="56" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="402" font-size="10.5" font-weight="bold" fill="#b91c1c">回滚动作</text>
    <text x="118" y="402" font-size="11" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">kubectl -n order-demo-prod rollout undo deployment/gateway --to-revision=&lt;n&gt;</text>
    <text x="48" y="423" font-size="10.5" fill="#7f1d1d">生产走路径 C（Git 提交 git-&lt;sha7&gt;）；修订号仅在演练中按 history 三步辨认，不现场挑。</text>
  </g>

  <!-- ============ 行 2：蓝绿 ============ -->
  <g>
    <rect x="20" y="452" width="1200" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="452" width="6" height="190" rx="3" fill="#3b82f6"/>
    <text x="40" y="480" font-size="17" font-weight="bold" fill="#0f172a">蓝绿 Blue/Green</text>
    <text x="40" y="499" font-size="10" fill="#71717a">秒级整体回退 · 旧版全程在线</text>
    <rect x="290" y="458" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="487" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="487" font-size="12" fill="#78350f">无双倍容量 / 有状态会话粘滞 / 成本敏感 → 不该用</text>
    <rect x="36" y="510" width="1168" height="62" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="530" font-weight="bold" fill="#64748b">容量成本</text>
      <text x="48" y="550" fill="#334155">高：约双倍副本与资源</text>
      <text x="330" y="530" font-weight="bold" fill="#64748b">回退速度</text>
      <text x="330" y="550" fill="#334155">快：切一次 selector，秒级–1 分钟</text>
      <text x="620" y="530" font-weight="bold" fill="#64748b">流量粒度</text>
      <text x="620" y="550" fill="#334155">全量或零，无中间态</text>
      <text x="880" y="530" font-weight="bold" fill="#64748b">适用前提</text>
      <text x="880" y="550" fill="#334155">双倍容量 + 无长连接粘滞</text>
    </g>
    <rect x="36" y="578" width="1168" height="56" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="602" font-size="10.5" font-weight="bold" fill="#b91c1c">回滚动作</text>
    <text x="118" y="602" font-size="11" fill="#7f1d1d">把 gateway Service 的 selector 切回 version=&lt;旧sha7&gt;；切流前置条件：目标 Ready ≥ replicas。</text>
    <text x="48" y="623" font-size="10.5" fill="#7f1d1d">优势在时效表 C 行：回退不改 Pod、不占 Surge 容量，容量故障也能秒级退。</text>
  </g>

  <!-- ============ 行 3：金丝雀 ============ -->
  <g>
    <rect x="20" y="652" width="1200" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="652" width="6" height="190" rx="3" fill="#a855f7"/>
    <text x="40" y="680" font-size="17" font-weight="bold" fill="#0f172a">金丝雀 Canary</text>
    <text x="40" y="699" font-size="10" fill="#71717a">按指标决定继续或回退 · 影响面只有台阶比例</text>
    <rect x="290" y="658" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="687" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="687" font-size="12" fill="#78350f">没有 SLI 与判定指标 → 不要选；「手动分批看看」不是金丝雀</text>
    <rect x="36" y="710" width="1168" height="62" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="730" font-weight="bold" fill="#64748b">容量成本</text>
      <text x="48" y="750" fill="#334155">中：少量额外 canary 副本</text>
      <text x="330" y="730" font-weight="bold" fill="#64748b">回退速度</text>
      <text x="330" y="750" fill="#334155">中：秒级–2 分钟，取决于放量台阶</text>
      <text x="620" y="730" font-weight="bold" fill="#64748b">流量粒度</text>
      <text x="620" y="750" fill="#334155">按请求比例 / 按副本比例</text>
      <text x="880" y="730" font-weight="bold" fill="#64748b">适用前提</text>
      <text x="880" y="750" fill="#334155">副本 ≥ 4 + 用户可感 SLI</text>
    </g>
    <rect x="36" y="778" width="1168" height="56" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="802" font-size="10.5" font-weight="bold" fill="#b91c1c">回滚动作</text>
    <text x="118" y="802" font-size="11" fill="#7f1d1d">abort → 流量权重回位，销毁 canary Pod；自动回滚见第 15 章 AnalysisTemplate。</text>
    <text x="48" y="823" font-size="10.5" fill="#7f1d1d">硬前提：新旧版本必须能在同一 schema 上共存，否则回退只是把故障换个样子。</text>
  </g>

  <!-- ============ 行 4：容量账 ============ -->
  <g>
    <rect x="20" y="852" width="1200" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="852" width="6" height="190" rx="3" fill="#f59e0b"/>
    <text x="40" y="880" font-size="17" font-weight="bold" fill="#0f172a">容量账四组合（replicas=4）</text>
    <text x="290" y="880" font-size="10.5" fill="#64748b">先填这张表，再写回滚方案，两者都通过才允许发布</text>
    <g font-size="10.5">
      <rect x="40" y="892" width="280" height="134" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="52" y="912" font-size="12" font-weight="bold" fill="#166534">A 默认滚动 · surge1 / unavail0</text>
      <text x="52" y="932" fill="#334155">峰值 5 · 最少可用 4</text>
      <text x="52" y="952" fill="#334155">峰值 requests 500m / 640Mi</text>
      <text x="52" y="972" fill="#334155">节点余量：够</text>
      <text x="52" y="998" font-weight="bold" fill="#166534">结论：可发布，仍有 1 个 Pod 的零不可用保障</text>

      <rect x="334" y="892" width="280" height="134" rx="5" fill="#fef2f2" stroke="#fecaca"/>
      <text x="346" y="912" font-size="12" font-weight="bold" fill="#991b1b">B 高峰余量紧张 · 1 / 0</text>
      <text x="346" y="932" fill="#334155">峰值 5 · 最少可用 4</text>
      <text x="346" y="952" fill="#334155">节点余量仅 300m，不够</text>
      <text x="346" y="972" fill="#7f1d1d">新 Pod Pending，rollout 卡死</text>
      <text x="346" y="998" font-weight="bold" fill="#991b1b">结论：降 surge 或先扩容，别硬发</text>

      <rect x="628" y="892" width="280" height="134" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="640" y="912" font-size="12" font-weight="bold" fill="#166534">C 允许少量不可用 · 0 / 1</text>
      <text x="640" y="932" fill="#334155">峰值 4 · 最少可用 3</text>
      <text x="640" y="952" fill="#334155">峰值 requests 400m / 512Mi</text>
      <text x="640" y="972" fill="#334155">节点余量：够</text>
      <text x="640" y="998" font-weight="bold" fill="#166534">结论：不额外占容量，窗口内少一副本</text>

      <rect x="922" y="892" width="278" height="134" rx="5" fill="#fffbeb" stroke="#fde68a"/>
      <text x="934" y="912" font-size="12" font-weight="bold" fill="#92400e">D 激进 · surge2 / unavail1</text>
      <text x="934" y="932" fill="#334155">峰值 6 · 最少可用 3</text>
      <text x="934" y="952" fill="#334155">峰值 requests 600m / 768Mi</text>
      <text x="934" y="972" fill="#92400e">节点余量不够</text>
      <text x="934" y="998" font-weight="bold" fill="#92400e">结论：峰值 6 放不下，且可用数掉到 3</text>
    </g>
  </g>

  <!-- ============ 行 5：回滚时钟 ============ -->
  <g>
    <rect x="20" y="1052" width="1200" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="1052" width="6" height="190" rx="3" fill="#dc2626"/>
    <text x="40" y="1080" font-size="17" font-weight="bold" fill="#0f172a">回滚时钟 T0 → T5</text>
    <text x="290" y="1080" font-size="10.5" fill="#64748b">触发到验证 ≤ 11 分钟（含 GitOps 同步 30–120 秒）</text>
    <g font-size="10.5">
      <rect x="40" y="1092" width="186" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="52" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T0 触发 ≤2min</text>
      <text x="52" y="1132" fill="#334155">对照触发条件确认命中</text>
      <text x="52" y="1152" fill="#334155">产出：指标值 X 的判断记录</text>
      <text x="52" y="1172" fill="#64748b">值班 + 告警</text>

      <rect x="234" y="1092" width="186" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="246" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T1 审批 ≤2min</text>
      <text x="246" y="1132" fill="#334155">owner 一句「同意回退」</text>
      <text x="246" y="1152" fill="#334155">多组件/数据面升变更经理</text>
      <text x="246" y="1172" fill="#64748b">PR review 即审批留痕</text>

      <rect x="428" y="1092" width="186" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="440" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T2 定目标 ≤1min</text>
      <text x="440" y="1132" fill="#334155">按方案「目标产物」栏</text>
      <text x="440" y="1152" fill="#334155">明确到 git-&lt;sha7&gt;</text>
      <text x="440" y="1172" fill="#64748b">不现场翻 history 挑</text>

      <rect x="622" y="1092" width="186" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="634" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T3 执行 ≤3min</text>
      <text x="634" y="1132" fill="#334155">生产走路径 C（Git 提交）</text>
      <text x="634" y="1152" fill="#334155">蓝绿走路径 D（切 selector）</text>
      <text x="634" y="1172" fill="#64748b">A/B 仅限演练环境</text>

      <rect x="816" y="1092" width="186" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="828" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T4 验证 ≤3min</text>
      <text x="828" y="1132" fill="#334155">四判据逐条核对</text>
      <text x="828" y="1152" fill="#334155">输出贴值班记录与 PR</text>
      <text x="828" y="1172" fill="#64748b">缺一不算完成 ↓</text>

      <rect x="1010" y="1092" width="190" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="1022" y="1112" font-size="12" font-weight="bold" fill="#991b1b">T5 收尾 窗口结束前</text>
      <text x="1022" y="1132" fill="#334155">观察窗口按第 20 章预算定</text>
      <text x="1022" y="1152" fill="#334155">归因与复盘写事故文档</text>
      <text x="1022" y="1172" fill="#64748b">owner + SRE</text>
    </g>
    <rect x="36" y="1192" width="1168" height="40" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="1218" font-size="10.5" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">kubectl -n order-demo-prod get deploy gateway -o jsonpath='{.spec.template.spec.containers[0].image}'   # 核对回到稳定 SHA</text>
  </g>

  <!-- ============ T4 四判据 ============ -->
  <rect x="20" y="1254" width="1200" height="140" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="1278" font-size="13" font-weight="bold" fill="#6d28d9">T4 四判据，缺一不算完成</text>
  <text x="40" y="1302" font-size="11.5" fill="#4c1d95">① 目标 SHA 且 availableReplicas == replicas；部署与发版记录一致</text>
  <text x="40" y="1324" font-size="11.5" fill="#4c1d95">② 连续 30 次 /healthz 全 200，5xx 回落到发布前基线</text>
  <text x="40" y="1346" font-size="11.5" fill="#4c1d95">③ 指标是趋势反转，不是某个瞬时点；瞬时值回落后再观察一个窗口</text>
  <text x="40" y="1368" font-size="11.5" fill="#4c1d95">④ rollout history 或 Service selector 有可查记录——无法证明的回滚等于没回滚</text>

  <!-- ============ 关卡条 ============ -->
  <rect x="20" y="1406" width="1200" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="1430" font-size="13" font-weight="bold" fill="#b91c1c">关卡：T0 是判据，不是感觉</text>
  <text x="40" y="1452" font-size="11" fill="#7f1d1d">未命中触发条件 → 观察并记录；命中 → 不许「再看看」。反复 undo 无效时停止回退，转前向修复 hotfix 重走发布链路。</text>
  <text x="40" y="1474" font-size="11" fill="#7f1d1d">若应用已回滚但数据按新格式写入 → 触发第 16 章 expand–contract 共存预案，这不是本章能靠 undo 解决的问题。</text>

  <!-- ============ 页脚 ============ -->
  <text x="40" y="1640" font-size="10" fill="#94a3b8">《一次变更的旅程》第 13 章 §13.2 / §13.5 · v1.4.4 · 详见第 13 章；与卡②切分：本卡回退整个发布，卡②单副本级止血</text>
  <text x="1200" y="1640" text-anchor="end" font-size="10" fill="#94a3b8">速查附件 · 不进正文插图计数</text>
</svg>
