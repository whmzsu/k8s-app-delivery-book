<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1680" viewBox="0 0 1240 1680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="1240" height="1680" fill="#ffffff"/>

  <!-- ============ 页眉 ============ -->
  <rect x="0" y="0" width="1240" height="92" fill="#1e293b"/>
  <text x="40" y="49" font-size="27" font-weight="bold" fill="#ffffff">告警分级矩阵卡</text>
  <text x="40" y="76" font-size="13" fill="#cbd5e1">第 22 章 · §22.2 · 五级别 × 燃尽率 × 路由 × 抑制关系</text>
  <rect x="1080" y="26" width="120" height="40" rx="20" fill="#334155" stroke="#475569"/>
  <text x="1140" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">v1.4.4</text>
  <rect x="0" y="92" width="1240" height="20" fill="#f1f5f9"/>
  <text x="40" y="106" font-size="10.5" fill="#64748b">唯一判据：接收者此刻能做什么？能动作的才配 paging。下游接卡②故障症状卡。</text>

  <!-- ============ 四问判定顺序 ============ -->
  <rect x="20" y="124" width="1200" height="116" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="40" y="149" font-size="13" font-weight="bold" fill="#0369a1">自上而下四问（顺序不可跳）</text>
  <g font-size="10.5">
    <rect x="40" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="52" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">① 在抑制/静默窗口吗</text>
    <text x="52" y="197" fill="#475569">是 → 按登记放行或静默</text>
    <text x="52" y="216" fill="#475569">演练窗口由 mute_time_intervals 覆盖</text>

    <rect x="334" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="346" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">② 阈值来自预算吗</text>
    <text x="346" y="197" fill="#475569">第 20 章 14.4 / 6 / 1 推导</text>
    <text x="346" y="216" fill="#475569">否 → 回第 20 章，禁止拍数字</text>

    <rect x="628" y="158" width="280" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="640" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">③ 带 runbook 吗</text>
    <text x="640" y="197" fill="#475569">首步动作 + 升级路径 + dashboard</text>
    <text x="640" y="216" fill="#475569">缺注解 → 不允许合并，先补</text>

    <rect x="922" y="158" width="278" height="72" rx="5" fill="#ffffff" stroke="#bae6fd"/>
    <text x="934" y="178" font-size="12" font-weight="bold" fill="#0c4a6e">④ 命中哪一级</text>
    <text x="934" y="197" fill="#475569">M1→M5 自上而下，命中即停</text>
    <text x="934" y="216" fill="#475569">按矩阵路由，周会复盘命中率</text>
  </g>

  <!-- ============ 行 1：M1 ============ -->
  <g>
    <rect x="20" y="252" width="1200" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="252" width="6" height="170" rx="3" fill="#dc2626"/>
    <text x="40" y="280" font-size="17" font-weight="bold" fill="#0f172a">M1　快燃尽</text>
    <text x="40" y="299" font-size="10" fill="#71717a">1h 辅以 5m 确认窗 · 约烧 2% 预算</text>
    <rect x="290" y="258" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="287" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="287" font-size="12" fill="#78350f">1h 与 5m 双窗燃尽率均 ≥ 14.4；或 5xx 突增且 SLI 跌破阈值</text>
    <rect x="36" y="310" width="1168" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="332" font-weight="bold" fill="#64748b">级别</text>
      <text x="48" y="350" font-weight="bold" fill="#b91c1c">paging</text>
      <text x="290" y="332" font-weight="bold" fill="#64748b">路由 receiver</text>
      <text x="290" y="350" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">paging-oncall</text>
      <text x="580" y="332" font-weight="bold" fill="#64748b">通知节奏</text>
      <text x="580" y="350" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">wait 10s / interval 1m / repeat 30m</text>
      <text x="960" y="332" font-weight="bold" fill="#64748b">响应时限</text>
      <text x="960" y="350" fill="#334155">5 分钟内认领</text>
    </g>
    <rect x="36" y="368" width="1168" height="46" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="389" font-size="10.5" font-weight="bold" fill="#b91c1c">值班动作</text>
    <text x="118" y="389" font-size="11" fill="#7f1d1d">电话/寻呼认领 → 转卡②。抑制同 service 全部 ticket；被 M3 与静默抑制。</text>
    <text x="118" y="407" font-size="10" fill="#9f1239">不该 paging：单容器 CPU / 单副本重启 / 演练窗口内。</text>
  </g>

  <!-- ============ 行 2：M2 ============ -->
  <g>
    <rect x="20" y="432" width="1200" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="432" width="6" height="170" rx="3" fill="#f97316"/>
    <text x="40" y="460" font-size="17" font-weight="bold" fill="#0f172a">M2　慢燃尽</text>
    <text x="40" y="479" font-size="10" fill="#71717a">6h 窗口 · 约烧 5% 预算 · 慢性劣化</text>
    <rect x="290" y="438" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="467" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="467" font-size="12" fill="#78350f">6h 燃尽率 ≥ 6；快燃尽同时发生时被 M1 压制，不重复通知</text>
    <rect x="36" y="490" width="1168" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="512" font-weight="bold" fill="#64748b">级别</text>
      <text x="48" y="530" font-weight="bold" fill="#c2410c">ticket</text>
      <text x="290" y="512" font-weight="bold" fill="#64748b">路由 receiver</text>
      <text x="290" y="530" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">ticket-default</text>
      <text x="580" y="512" font-weight="bold" fill="#64748b">通知节奏</text>
      <text x="580" y="530" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">wait 30s / interval 5m / repeat 4h</text>
      <text x="960" y="512" font-weight="bold" fill="#64748b">响应时限</text>
      <text x="960" y="530" fill="#334155">1 个工作日内</text>
    </g>
    <rect x="36" y="548" width="1168" height="46" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="569" font-size="10.5" font-weight="bold" fill="#b91c1c">值班动作</text>
    <text x="118" y="569" font-size="11" fill="#7f1d1d">进工单队列 + 当值群；被 M1 抑制（快窗必然同向越界）。</text>
    <text x="118" y="587" font-size="10" fill="#9f1239">不该 paging：上班时段能处理、且无用户可感恶化。</text>
  </g>

  <!-- ============ 行 3：M3 ============ -->
  <g>
    <rect x="20" y="612" width="1200" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="612" width="6" height="170" rx="3" fill="#8b5cf6"/>
    <text x="40" y="640" font-size="17" font-weight="bold" fill="#0f172a">M3　预算耗尽冻结</text>
    <text x="40" y="659" font-size="10" fill="#71717a">28 天窗口 · 已不是「告警」而是「事实」</text>
    <rect x="290" y="618" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="647" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="647" font-size="12" fill="#78350f">release_freeze == 1；预算已空，paging 改变不了冻结事实</text>
    <rect x="36" y="670" width="1168" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="692" font-weight="bold" fill="#64748b">级别</text>
      <text x="48" y="710" font-weight="bold" fill="#6d28d9">ticket</text>
      <text x="290" y="692" font-weight="bold" fill="#64748b">路由 receiver</text>
      <text x="290" y="710" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">ticket-default</text>
      <text x="580" y="692" font-weight="bold" fill="#64748b">通知节奏</text>
      <text x="580" y="710" fill="#334155">同 M2（30s / 5m / 4h）</text>
      <text x="960" y="692" font-weight="bold" fill="#64748b">响应时限</text>
      <text x="960" y="710" fill="#334155">当日核对冻结清单</text>
    </g>
    <rect x="36" y="728" width="1168" height="46" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="749" font-size="10.5" font-weight="bold" fill="#b91c1c">值班动作</text>
    <text x="118" y="749" font-size="11" fill="#7f1d1d">抑制同 service 全部 paging；恢复走工单 + 第 20 章例外登记双签。</text>
    <text x="118" y="767" font-size="10" fill="#9f1239">预算冻结是发布流程状态，不是靠加大通知力度能解除的告警。</text>
  </g>

  <!-- ============ 行 4：M4 ============ -->
  <g>
    <rect x="20" y="792" width="1200" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="792" width="6" height="170" rx="3" fill="#94a3b8"/>
    <text x="40" y="820" font-size="17" font-weight="bold" fill="#0f172a">M4　趋势 / 抖动记录</text>
    <text x="40" y="839" font-size="10" fill="#71717a">3d 窗口 · 约烧 10% 预算 · 仅落库</text>
    <rect x="290" y="798" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="827" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="827" font-size="12" fill="#78350f">3d 燃尽率 ≥ 1；探针抖动；配置漂移检出 → 都不叫人</text>
    <rect x="36" y="850" width="1168" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="872" font-weight="bold" fill="#64748b">级别</text>
      <text x="48" y="890" font-weight="bold" fill="#475569">info（记录）</text>
      <text x="290" y="872" font-weight="bold" fill="#64748b">路由 receiver</text>
      <text x="290" y="890" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">record-only</text>
      <text x="580" y="872" font-weight="bold" fill="#64748b">通知节奏</text>
      <text x="580" y="890" fill="#334155">不进通知流，不挂 notifier</text>
      <text x="960" y="872" font-weight="bold" fill="#64748b">响应时限</text>
      <text x="960" y="890" fill="#334155">不要求</text>
    </g>
    <rect x="36" y="908" width="1168" height="46" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="48" y="929" font-size="10.5" font-weight="bold" fill="#475569">值班动作</text>
    <text x="118" y="929" font-size="11" fill="#334155">周会复盘与下钻上下文；无通知即无抑制必要。</text>
    <text x="118" y="947" font-size="10" fill="#64748b">任何会触发人工通知的场合都不该用 info 顶替——级别要与可动作性一致。</text>
  </g>

  <!-- ============ 行 5：M5 ============ -->
  <g>
    <rect x="20" y="972" width="1200" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="972" width="6" height="170" rx="3" fill="#3b82f6"/>
    <text x="40" y="1000" font-size="17" font-weight="bold" fill="#0f172a">M5　p99 延迟越界</text>
    <text x="40" y="1019" font-size="10" fill="#71717a">非燃尽症状 · 只做下钻上下文</text>
    <rect x="290" y="978" width="914" height="46" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="304" y="1007" font-size="10.5" font-weight="bold" fill="#92400e">一眼判据</text>
    <text x="380" y="1007" font-size="12" fill="#78350f">p99 越界不等于用户可感；同时满足 M1 时由 M1 承载 paging</text>
    <rect x="36" y="1030" width="1168" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5">
      <text x="48" y="1052" font-weight="bold" fill="#64748b">级别</text>
      <text x="48" y="1070" font-weight="bold" fill="#475569">info（记录）</text>
      <text x="290" y="1052" font-weight="bold" fill="#64748b">路由 receiver</text>
      <text x="290" y="1070" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" fill="#1e293b">record-only</text>
      <text x="580" y="1052" font-weight="bold" fill="#64748b">通知节奏</text>
      <text x="580" y="1070" fill="#334155">不进通知流</text>
      <text x="960" y="1052" font-weight="bold" fill="#64748b">响应时限</text>
      <text x="960" y="1070" fill="#334155">不要求</text>
    </g>
    <rect x="36" y="1088" width="1168" height="46" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="48" y="1109" font-size="10.5" font-weight="bold" fill="#475569">值班动作</text>
    <text x="118" y="1109" font-size="11" fill="#334155">仅在 M1 触发时作为下钻上下文出现，不单独通知。</text>
    <text x="118" y="1127" font-size="10" fill="#64748b">没有燃尽率支撑的延迟告警，先回第 20 章确认 SLI 口径。</text>
  </g>

  <!-- ============ 窗口口径 ============ -->
  <rect x="20" y="1154" width="1200" height="106" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="1178" font-size="13" font-weight="bold" fill="#6d28d9">三个燃尽率窗口，来自第 20 章错误预算（禁止另起数字）</text>
  <text x="40" y="1202" font-size="11.5" fill="#4c1d95">1h + 5m 确认 → 14.4，约烧 2% 预算，叫人　｜　6h → 6，约烧 5%，工作日处理　｜　3d → 1，约烧 10%，周会复盘</text>
  <text x="40" y="1226" font-size="11.5" fill="#4c1d95">阈值型误报要回第 20 章改预算口径再重推阈值；就地改规则文件的数字会破坏同源（CL-22-04）。</text>
  <text x="40" y="1248" font-size="11" fill="#7c3aed">抖动型用双窗 + for 挡，不要调高阈值——真故障恢复期的抖动会一起被吞掉。</text>

  <!-- ============ 抑制关卡 ============ -->
  <rect x="20" y="1272" width="1200" height="128" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="1296" font-size="13" font-weight="bold" fill="#b91c1c">抑制关卡：方向永远从「信息量更大」指向「信息量更小」</text>
  <text x="40" y="1320" font-size="11.5" fill="#7f1d1d">M3 抑制同 service 全部 paging；M1 抑制 M2 与 M5。预算已空时再 paging 只是重复「预算没了」这个已知事实。</text>
  <text x="40" y="1342" font-size="11.5" fill="#7f1d1d">静默优先于一切抑制：silence 精确到 alertname，带 author + comment + 到期时间；paging 静默需第二人复核。</text>
  <text x="40" y="1364" font-size="11.5" fill="#7f1d1d">静默预算红线 10%：连续两月超线，对应规则升级为清退候选——静默在替规则还债，债务记月报。</text>
  <text x="40" y="1388" font-size="11" font-weight="bold" fill="#991b1b">周会只看四件事：命中率 / 误报率 / 认领中位时长 / 静默覆盖次数；噪音治理是闭环，不是把阈值调高。</text>

  <!-- ============ 页脚 ============ -->
  <text x="40" y="1640" font-size="10" fill="#94a3b8">《一次变更的旅程》第 22 章 §22.2 · v1.4.4 · 详见第 22 章；上游接第 20 章预算，下游接卡②症状卡</text>
  <text x="1200" y="1640" text-anchor="end" font-size="10" fill="#94a3b8">速查附件 · 不进正文插图计数</text>
</svg>
