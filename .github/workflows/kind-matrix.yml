# P5 技术复核：真 kind 集群 × K8s 版本矩阵
# 与 ci.yml 分工：这里跑 server dry-run、真实部署与运行时演练；快车道只做静态与 schema 校验。
# 私有仓库 Actions 有分钟额度，故默认只在「示例基线变更 / 每周 / 手动」时触发。
name: P5 技术复核 · kind 版本矩阵

on:
  workflow_dispatch:
    inputs:
      # 注意：choice 的 options 不允许空字符串（GitHub 解析期拒绝，整个 workflow 启动失败，
      # 首跑实测见 consistency-log D-27），用 'all' 作为「跑全部」的哨兵值
      single_version:
        description: '跑哪些版本（all=全部；版本与 kind 成对锁定）'
        required: false
        default: 'all'
        type: choice
        options: ['all', '1.32.2', '1.34.11', '1.37.0']
      no_drill:
        description: '跳过运行时演练（只做清单 dry-run）'
        required: false
        default: false
        type: boolean
  schedule:
    # 每周一 03:23 UTC（北京时间 11:23），避开整点高峰
    - cron: '23 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'examples/order-demo/**'
      - 'examples/by-chapter/**'
      - 'chapters/ch06.md'
      - 'chapters/ch08.md'
      - 'chapters/ch13.md'
      - 'hack/check-version-matrix.sh'
      - 'hack/validate-manifests.py'
      - '.github/workflows/kind-matrix.yml'

permissions:
  contents: read

concurrency:
  group: p5-${{ github.ref }}
  cancel-in-progress: false

env:
  SOFT_LIMIT: '12'   # 章节增量清单 soft dry-run 失败阈值，见 check-version-matrix.sh

jobs:
  kind:
    name: K8s ${{ matrix.k8s }} · ${{ matrix.role }}
    # job 级 if 不能引用 matrix 上下文（官方 Contexts availability 表：
    # jobs.<job_id>.if 只有 github/needs/vars/inputs），所以单版本过滤
    # 要放到各步骤的 step 级 if 上
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # kind 版本与 node 镜像必须成对锁定：最新 kind 不再支持最旧 K8s。
      # 版本取自各 kind release notes 明确列出的 kindest/node tag，见附录 A-02 / A-37。
      matrix:
        include:
          - { k8s: '1.32.2',  kind: 'v0.27.0', role: '写作基线 1.32' }
          - { k8s: '1.34.11', kind: 'v0.33.0', role: '书稿上界 1.34' }
          - { k8s: '1.37.0',  kind: 'v0.33.0', role: '当前稳定版' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hack/requirements.txt
      - run: pip install -r hack/requirements.txt

      - name: 安装 kind / kubectl（版本成对锁定，写入 job summary）
        if: github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s
        run: |
          set -euo pipefail
          KIND_VERSION="${{ matrix.kind }}"
          KUBE_VERSION="v${{ matrix.k8s }}"
          curl -fsSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          {
            echo "### 工具版本 · K8s ${{ matrix.k8s }}（${{ matrix.role }}）"
            echo "- kind \`${KIND_VERSION}\` / node \`kindest/node:${KUBE_VERSION}\` / kubectl \`${KUBE_VERSION}\`"
            echo "- 组合取自 kind release notes 明确支持的 node 镜像，见附录 A-02 / A-37"
          } >> "$GITHUB_STEP_SUMMARY"
          kind version
          kubectl version --client

      - name: 预检 node 镜像（不存在直接失败，不静默跳过）
        if: github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s
        run: |
          set -euo pipefail
          NODE="kindest/node:v${{ matrix.k8s }}"
          echo "拉取 ${NODE}"
          docker pull "${NODE}"

      - name: 创建集群
        id: cluster
        if: github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s
        run: |
          set -euo pipefail
          CLUSTER="p5-$(echo '${{ matrix.k8s }}' | tr '.' '-')"
          echo "name=${CLUSTER}" >> "$GITHUB_OUTPUT"
          kind create cluster --name "${CLUSTER}" \
            --image "kindest/node:v${{ matrix.k8s }}" --wait 180s
          kubectl config use-context "kind-${CLUSTER}"
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: P5 复核（清单 dry-run + 基线部署 + 运行时演练）
        id: p5
        if: github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ inputs.no_drill }}" == "true" ]]; then EXTRA+=(--no-drill); fi
          bash hack/check-version-matrix.sh \
            --mode ci \
            --version "${{ matrix.k8s }}" \
            --cluster "${{ steps.cluster.outputs.name }}" \
            "${EXTRA[@]}"

      - name: 失败诊断
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s)
        run: |
          echo "== 集群资源 =="
          kubectl get all -A -o wide || true
          echo "== 事件（最近 60 条） =="
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "== order-demo 详情 =="
          kubectl -n order-demo-dev describe pods,deploy,svc,endpoints || true
          echo "== port-forward 日志 =="
          cat /tmp/ci-drill-portforward.log || true
          echo "== dry-run 失败明细（尾部） =="
          tail -80 build/p5-server-dryrun.log || true

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s)
        with:
          name: p5-report-${{ matrix.k8s }}
          path: |
            build/p5-server-dryrun.log
            build/manifests/_index.tsv
            build/manifests/builtin.txt
            build/manifests/crd.txt
          if-no-files-found: warn

      - name: 清理集群
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.single_version == 'all' || inputs.single_version == matrix.k8s)
        run: kind delete cluster --name "${{ steps.cluster.outputs.name }}" || true
