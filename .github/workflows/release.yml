name: Release（四格式构建与发布资产）

# 仅在本仓库打 tag（v*.*.*）时触发，把 build_dist.py 产出的
# HTML / PDF / EPUB / DOCX / build-report.md 上传为该 tag 的 Release 资产。
# 上传前统一重命名为 `journey-of-a-change-v<ver>.*`（<ver> 为去 v 前缀的 tag），
# 与既有 v1.4.0 等 Release 资产命名一致，避免中文书名文件名与既有资产割裂。
# DOCX/EPUB 为纯 Python（python-docx）离线可跑；PDF 经 headless 浏览器打印
# （与本地 Edge 行为一致），ubuntu runner 无预装浏览器，故先装 Chromium 并
# 软链为 `chrome` 供 build_dist.find_edge() 识别。
# 全部 Action 按 D-53 口径钉 commit SHA；gh CLI 为 runner 自带。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: 构建四格式并发布到 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      # ubuntu runner 默认无中文字体：Chromium 打印时中文会变豆腐块。
      # 必须安装 CJK 字体，且 CSS 字体栈要列出对应字体名（见 build_dist.CSS），
      # 二者缺一不可。Noto CJK 同时提供 Serif（宋体观感）与 Sans（黑体观感）。
      - name: Install headless Chromium + CJK fonts for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium fonts-noto-cjk
          sudo ln -sf "$(command -v chromium)" /usr/local/bin/chrome
          fc-cache -fv >/dev/null 2>&1 || true

      - name: Install build dependencies
        run: pip install -r hack/requirements.txt

      - name: Build all formats (HTML/PDF/EPUB/DOCX + build-report)
        run: python hack/build_dist.py --keep-html --out dist

      # D-62 硬闸门：中文必须真的能显示、能检索。
      # D-60 的教训：v1.4.1 的 PDF 因为 runner 缺中文字体，中文全是豆腐块，
      # 但当时只校验「文件生成成功 + 体积没变」，坏件照样发布。
      # 本步骤不通过则整条流水线失败，Release 不会被创建。
      - name: Assert PDF renders Chinese (font embedding gate)
        run: |
          python hack/check-pdf-fonts.py \
            --pdf "dist/一次变更的旅程.pdf" \
            --report "dist/pdf-font-report.md"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"                        # 1.4.0
          SLUG="journey-of-a-change-v${VER}"   # journey-of-a-change-v1.4.0
          cd dist
          # build_dist 产出中文书名，上传前统一改为发布 slug 命名，避免与既有资产割裂
          [ -f "一次变更的旅程.pdf" ]  && mv "一次变更的旅程.pdf"  "${SLUG}.pdf"
          [ -f "一次变更的旅程.epub" ] && mv "一次变更的旅程.epub" "${SLUG}.epub"
          [ -f "一次变更的旅程.docx" ] && mv "一次变更的旅程.docx" "${SLUG}.docx"
          [ -f "_book.html" ]              && mv "_book.html"       "${SLUG}.html"
          [ -f "build-report.md" ]        && mv "build-report.md"  "${SLUG}-build-report.md"
          # D-62 校验报告随 Release 一起留证：可回溯每个版本的字体嵌入证据
          [ -f "pdf-font-report.md" ]     && mv "pdf-font-report.md" "${SLUG}-pdf-font-report.md"
          cd ..
          gh release create "${TAG}" dist/* \
            --title "Release ${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" dist/* --clobber
