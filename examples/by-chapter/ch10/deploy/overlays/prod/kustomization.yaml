apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-demo-prod
resources:
  - ../../base
replicas:
  - name: gateway
    count: 3
  - name: api
    count: 3
patches:
  - target:
      kind: ConfigMap
      name: order-demo-config
    patch: |-
      - op: replace
        path: /data/GREETING
        value: "hello from configmap (prod)"
