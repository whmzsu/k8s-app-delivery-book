apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-demo-api
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["order-demo-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-demo-api
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
subjects:
  - kind: ServiceAccount
    name: api
    namespace: order-demo-dev
roleRef:
  kind: Role
  name: order-demo-api
  apiGroup: rbac.authorization.k8s.io
