apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: order-demo-vault
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
spec:
  provider:
    vault:
      server: "${VAULT_ADDR}"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "order-demo"
          serviceAccountRef:
            name: external-secrets
