apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-demo-db-credentials
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: order-demo-vault
    kind: SecretStore
  target:
    name: order-demo-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: order-demo/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: order-demo/db-credentials
        property: password
