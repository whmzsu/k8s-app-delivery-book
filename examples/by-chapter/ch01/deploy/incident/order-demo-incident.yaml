# 合成案例：故意写错的反面样本，仅用于 ch01-incident 复现事故。
# 它违反第 3 章将确立的公理；正确形态从第 6 章起给出。
apiVersion: v1
kind: Namespace
metadata:
  name: order-demo-prod
  labels:
    app.kubernetes.io/name: order-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-demo-config
  namespace: order-demo-prod
  labels:
    app.kubernetes.io/name: order-demo
data:
  PAYMENT_TIMEOUT_MS: "3000"
  # H6：凭据与业务配置混在同一对象，轮换必须改它并重建 Pod
  DB_PASSWORD: "plaintext-incident-only"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: order-demo-prod
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-demo
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-demo
        app.kubernetes.io/component: gateway
    spec:
      # H2 伏笔：没有 Git 声明来源，运行对象可被 kubectl edit 直接改
      automountServiceAccountToken: true
      containers:
        - name: gateway
          # H1：latest 是可变指针，事故前已被另一次 CI 覆盖
          image: registry.example.com/order-demo/gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # H3：无 readinessProbe，滚动更新永远等不到 Ready
          # H4：无 livenessProbe / startupProbe，健康判定缺失
          envFrom:
            - configMapRef:
                name: order-demo-config
          # 安全项 CL-S-01 反面样本：privileged 且以 root 运行
          securityContext:
            privileged: true
            runAsNonRoot: false
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: order-demo-prod
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
