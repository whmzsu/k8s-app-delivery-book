apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: order-demo
  namespace: argocd
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: order-demo-dev
          - env: staging
            namespace: order-demo-staging
          - env: prod
            namespace: order-demo-prod
  template:
    metadata:
      name: "order-demo-{{env}}"
      labels:
        app.kubernetes.io/name: order-demo
        app.kubernetes.io/managed-by: argocd
    spec:
      project: order-demo
      source:
        repoURL: "https://git.example.com/order-demo/gitops.git"
        targetRevision: main
        path: "gitops/rendered/{{env}}"
        directory:
          recurse: false
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      revisionHistoryLimit: 10
