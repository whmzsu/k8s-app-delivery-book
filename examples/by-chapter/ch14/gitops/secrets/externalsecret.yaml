apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: order-demo-vault
  namespace: order-demo-prod
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "order-demo-prod"
          serviceAccountRef:
            name: "order-demo-eso"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-demo-db-credentials
  namespace: order-demo-prod
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: order-demo-vault
    kind: SecretStore
  target:
    name: order-demo-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "order-demo/prod/db"
        property: username
    - secretKey: password
      remoteRef:
        key: "order-demo/prod/db"
        property: password
