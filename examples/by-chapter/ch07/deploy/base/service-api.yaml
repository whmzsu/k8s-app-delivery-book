apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
