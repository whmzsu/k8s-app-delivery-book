apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: order-demo-gw
  namespace: order-demo-dev
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: argocd
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "order-demo.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: order-demo-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
