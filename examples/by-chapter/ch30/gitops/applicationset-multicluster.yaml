apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: order-demo-multicluster
  namespace: argocd
  labels:
    app.kubernetes.io/name: order-demo
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - env: prod
            namespace: order-demo-prod
            cluster: cluster-a
            tier: canary
            server: "https://cluster-a.example.com:6443"
          - env: prod
            namespace: order-demo-prod
            cluster: cluster-b
            tier: production
            server: "https://cluster-b.example.com:6443"
  template:
    metadata:
      name: "order-demo-{{env}}-{{cluster}}"
      labels:
        app.kubernetes.io/name: order-demo
        app.kubernetes.io/managed-by: argocd
        order-demo.io/tier: "{{tier}}"
    spec:
      project: order-demo
      source:
        repoURL: "https://git.example.com/order-demo/gitops.git"
        targetRevision: main
        path: "gitops/rendered/{{env}}"
        directory:
          recurse: false
      destination:
        server: "{{server}}"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      revisionHistoryLimit: 10
